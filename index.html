<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALTIME MONITOR | Статусы группы</title>
    <style>
        :root {
            --bg-main: #0b0d19;
            --bg-card: #151828;
            --bg-item: #1f233d;
            --text-main: #ffffff;
            --text-muted: #8e94b2;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --accent-purple: #7c4dff;
            --accent-orange: #ff9100;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            padding: 20px;
        }
        
        .container { 
            width: 100%; 
            max-width: 480px; 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-title {
            font-size: 24px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .header-title span { color: var(--accent-purple); }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Блок сессии и профиля */
        .user-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .avatar-stub {
            width: 48px;
            height: 48px;
            background: #66bb6a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .user-meta h3 { font-size: 16px; font-weight: 600; }
        .user-meta .online-status { font-size: 12px; color: var(--accent-green); display: flex; align-items: center; gap: 5px; }
        .user-meta .online-status::before { content: '●'; }

        .timer-display {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent-green);
            text-align: center;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .current-status-badge {
            text-align: center;
            font-size: 13px;
            color: var(--accent-orange);
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* Статистика в профиле */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            text-align: center;
            margin-top: 15px;
            background: rgba(0,0,0,0.15);
            padding: 12px;
            border-radius: 12px;
        }
        .stat-box .stat-val { font-size: 16px; font-weight: 700; color: #fff; }
        .stat-box .stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

        /* Кнопки управления */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .btn-start { background: var(--accent-green); color: #000; }
        .btn-stop { background: var(--accent-red); color: #fff; }
        .btn-logout { background: #303554; color: var(--text-main); }
        .btn-status { background: var(--bg-item); color: #fff; border: 1px solid rgba(255,255,255,0.05); }

        /* Списки участников */
        .monitor-list { display: flex; flex-direction: column; gap: 10px; }
        .monitor-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-item);
            padding: 12px 16px;
            border-radius: 14px;
        }
        .item-left { display: flex; align-items: center; gap: 12px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .item-name { font-weight: 600; font-size: 14px; }
        .item-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .item-time { font-family: monospace; font-size: 14px; color: var(--accent-green); font-weight: 600; }

        /* Вкладки Навигации внизу */
        .tab-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            background: var(--bg-card);
            padding: 6px;
            border-radius: 14px;
        }
        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            padding: 10px;
            font-size: 12px;
            border-radius: 10px;
        }
        .tab-btn.active {
            background: var(--bg-item);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Достижения */
        .achievements-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .ach-card {
            background: var(--bg-item);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            position: relative;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .ach-card.locked { opacity: 0.4; filter: grayscale(0.8); }
        .ach-card.locked::after {
            content: '🔒';
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 11px;
        }
        .ach-icon { font-size: 24px; }
        .ach-info h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .ach-info p { font-size: 10px; color: var(--text-muted); line-height: 1.3; }
        .ach-rarity {
            display: inline-block;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .rarity-common { background: rgba(255,255,255,0.1); color: #fff; }
        .rarity-rare { background: rgba(0,230,118,0.15); color: var(--accent-green); }
        .rarity-epic { background: rgba(124,77,255,0.15); color: #b388ff; }
        .rarity-legend { background: rgba(255,145,0,0.15); color: var(--accent-orange); }

        /* Чат */
        .chat-container { display: flex; flex-direction: column; gap: 10px; }
        .chat-messages {
            height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg-row { font-size: 13px; line-height: 1.4; }
        .msg-author { color: #9fa8da; font-weight: 600; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input {
            flex: 1;
            background: var(--bg-item);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            outline: none;
        }
        .chat-input-row button { background: var(--accent-purple); color: #fff; padding: 0 16px; }

        .badges-line { display: flex; gap: 4px; margin-top: 4px; }
        .badge-mini { font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">Realtime <span>Monitor</span></div>

    <div class="card">
        <div id="auth-view">
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 15px; font-size: 14px;">Войдите в аккаунт, чтобы отмечать статусы и копить время</p>
            <button onclick="loginWithGoogle()" style="background: #4285F4; color: white; width: 100%;">🔵 Войти через Google</button>
        </div>

        <div id="profile-view" style="display: none;">
            <div class="user-header">
                <div class="avatar-stub" id="myAvatarLetter">Р</div>
                <div class="user-meta">
                    <h3 id="myUsername">Загрузка...</h3>
                    <div class="online-status">В сети</div>
                </div>
            </div>

            <div class="timer-display" id="myTimer">00:00:00</div>
            <div class="current-status-badge" id="myCurrentStatus">🏠 Дома</div>

            <div class="btn-grid">
                <button id="sessionBtn" class="btn-start" onclick="toggleSession()">▶ Продолжить</button>
                <button class="btn-status" onclick="setStatus('☕ Перерыв', '#ff9100')">☕ Перерыв</button>
            </div>
            <div class="btn-grid">
                <button class="btn-status" onclick="setStatus('🔴 Занят', '#ff5252')">🔴 Занят</button>
                <button class="btn-status" onclick="setStatus('🏠 Дома', '#8e94b2')">🏠 Дома</button>
            </div>
            <button class="btn-logout" onclick="logout()" style="width: 100%; margin-top: 5px;">Выйти</button>

            <div class="stats-grid">
                <div class="stat-box"><div class="stat-val" id="statTime">0с</div><div class="stat-lbl">учёба</div></div>
                <div class="stat-box"><div class="stat-val" id="statSessions">0</div><div class="stat-lbl">сессий</div></div>
                <div class="stat-box"><div class="stat-val" id="statMsgs">0</div><div class="stat-lbl">сообщ.</div></div>
                <div class="stat-box"><div class="stat-val" id="statBadges">0</div><div class="stat-lbl">достиж.</div></div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="tabBtnGroup" onclick="switchTab('group')">👥 Участники</button>
        <button class="tab-btn" id="tabBtnLeader" onclick="switchTab('leader')">🏆 Рейтинг</button>
        <button class="tab-btn" id="tabBtnAch" onclick="switchTab('ach')">🏅 Достижения</button>
    </div>

    <div id="tab-group" class="tab-content card">
        <div class="card-title">Текущие статусы группы</div>
        <div class="monitor-list" id="groupList"></div>
    </div>

    <div id="tab-leader" class="tab-content card" style="display: none;">
        <div class="card-title">Топ студентов по времени</div>
        <div class="monitor-list" id="leaderboardList"></div>
    </div>

    <div id="tab-ach" class="tab-content card" style="display: none;">
        <div class="card-title">Все достижения (14 типов)</div>
        <div class="achievements-grid" id="achievementsList"></div>
    </div>

    <div class="card">
        <div class="card-title">Общий чат</div>
        <div class="chat-container">
            <div class="chat-messages" id="chatBox"></div>
            <div class="chat-input-row" id="chatInputArea" style="display: none;">
                <input type="text" id="chatInput" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button onclick="sendMsg()">➔</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Настройки проекта Рамины (из адреса url и настроек API)
    const SUPABASE_URL = 'https://aecurveycefurzgkloaq.supabase.co';
    const SUPABASE_KEY = 'ВСТАВЬ_СЮДА_ANON_KEY_ПРОЕКТА_РАМИНЫ'; 
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let isStudying = false;
    let activeTab = 'group';

    // Конфигурация 14 достижений (как на скриншоте)
    const ALL_ACHIEVEMENTS = {
        'first_step': { title: 'Первый шаг', desc: 'Пройти первую учебную сессию', icon: '🌱', rarity: 'common' },
        'return': { title: 'Возвращение', desc: 'Вернуться к учёбе после перерыва', icon: '🔄', rarity: 'common' },
        'pedestal': { title: 'Пьедестал', desc: 'Войти в топ-3 рейтинга группы', icon: '🏆', rarity: 'legend' },
        'legend': { title: 'Легенда', desc: 'Накопить 20 часов учёбы суммарно', icon: '⚡', rarity: 'legend' },
        'dedication': { title: 'Дедикация', desc: 'Накопить 10 часов учёбы суммарно', icon: '🔥', rarity: 'epic' },
        'soul': { title: 'Душа компании', desc: 'Написать 50 сообщений в чате', icon: '🎤', rarity: 'epic' },
        'workaholic': { title: 'Трудоголик', desc: 'Накопить 5 часов учёбы суммарно', icon: '💼', rarity: 'rare' },
        'activist': { title: 'Активист', desc: 'Написать 20 сообщений в чате', icon: '📣', rarity: 'rare' },
        'early_bird': { title: 'Ранняя пташка', desc: 'Начать сессию до 7:00 утра', icon: '🌅', rarity: 'rare' },
        'night_owl': { title: 'Полуночник', desc: 'Заниматься учёбой после полуночи', icon: '🦉', rarity: 'rare' },
        'marathon': { title: 'Марафонец', desc: 'Непрерывная сессия дольше 2 часов', icon: '🏃', rarity: 'epic' },
        'first_talk': { title: 'Первый контакт', desc: 'Отправить первое сообщение в чат', icon: '💬', rarity: 'common' },
        'coffee_break': { title: 'Кофеман', desc: 'Взять перерыв более 5 раз', icon: '☕', rarity: 'common' },
        'perfectionist': { title: 'Идеально', desc: 'Завершить день с ровным часом учёбы', icon: '🎯', rarity: 'epic' }
    };

    async function checkAuth() {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            currentUser = user;
            document.getElementById('auth-view').style.display = 'none';
            document.getElementById('profile-view').style.display = 'block';
            document.getElementById('chatInputArea').style.display = 'flex';
            
            const name = user.user_metadata.full_name || user.email.split('@')[0];
            document.getElementById('myUsername').innerText = name;
            document.getElementById('myAvatarLetter').innerText = name.charAt(0).toUpperCase();
            
            // Проверим, есть ли профиль в базе данных
            const { data: prof } = await supabase.from('profiles').select('*').eq('id', user.id).single();
            if (!prof) {
                await supabase.from('profiles').insert({ id: user.id, username: name, status: '🏠 Дома', color: '#8e94b2', study_time: 0 });
            }
        } else {
            document.getElementById('auth-view').style.display = 'block';
            document.getElementById('profile-view').style.display = 'none';
            document.getElementById('chatInputArea').style.display = 'none';
        }
        loadData();
    }

    async function loginWithGoogle() {
        await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
    }

    async function logout() {
        await supabase.auth.signOut();
        window.location.reload();
    }

    function formatTime(sec) {
        const h = Math.floor(sec / 3600).toString().padStart(2, '0');
        const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    async function setStatus(statusText, colorHex) {
        if (!currentUser) return;
        isStudying = (statusText === '📚 Учусь');
        
        const btn = document.getElementById('sessionBtn');
        if (isStudying) {
            btn.innerText = '⏹ Завершить';
            btn.className = 'btn-stop';
        } else {
            btn.innerText = '▶ Продолжить';
            btn.className = 'btn-start';
        }

        document.getElementById('myCurrentStatus').innerText = statusText;
        document.getElementById('myCurrentStatus').style.color = colorHex;

        // Логика проверки простых ачивок при смене статуса
        let { data: currentProf } = await supabase.from('profiles').select('badges, sessions_count').eq('id', currentUser.id).single();
        let updatedBadges = currentProf?.badges || [];
        let sCount = currentProf?.sessions_count || 0;

        if (statusText === '📚 Учусь') {
            sCount += 1;
            if (!updatedBadges.includes('first_step')) updatedBadges.push('first_step');
            
            // Проверка "Ранней пташки" (до 7 утра)
            if (new Date().getHours() < 7 && !updatedBadges.includes('early_bird')) updatedBadges.push('early_bird');
            // Проверка "Полуночника" (после 00:00)
            if (new Date().getHours() >= 0 && new Date().getHours() < 4 && !updatedBadges.includes('night_owl')) updatedBadges.push('night_owl');
        }

        if (statusText === '☕ Перерыв' && sCount > 0) {
            if (!updatedBadges.includes('return')) updatedBadges.push('return');
        }

        await supabase.from('profiles').update({ 
            status: statusText, 
            color: colorHex, 
            last_seen: new Date().toISOString(),
            sessions_count: sCount,
            badges: updatedBadges
        }).eq('id', currentUser.id);

        loadData();
    }

    function toggleSession() {
        if (isStudying) {
            setStatus('🏠 Дома', '#8e94b2');
        } else {
            setStatus('📚 Учусь', '#00e676');
        }
    }

    async function loadData() {
        // Загрузка участников группы
        const { data: users } = await supabase.from('profiles').select('*').order('username');
        if (users) {
            const listContainer = document.getElementById('groupList');
            listContainer.innerHTML = users.map(u => {
                const badgeIcons = (u.badges || []).map(bKey => ALL_ACHIEVEMENTS[bKey] ? `<span class="badge-mini" title="${ALL_ACHIEVEMENTS[bKey].title}">${ALL_ACHIEVEMENTS[bKey].icon}</span>` : '').join('');
                return `
                    <div class="monitor-item">
                        <div class="item-left">
                            <div class="status-dot" style="background: ${u.color || '#8e94b2'}"></div>
                            <div>
                                <div class="item-name">${u.username}</div>
                                <div class="item-sub">${u.status || '🏠 Дома'}</div>
                                <div class="badges-line">${badgeIcons}</div>
                            </div>
                        </div>
                        <div class="item-time">${formatTime(u.study_time || 0)}</div>
                    </div>
                `;
            }).join('');

            // Вывод личной статистики вошедшего
            if (currentUser) {
                const me = users.find(u => u.id === currentUser.id);
                if (me) {
                    document.getElementById('statTime').innerText = Math.floor((me.study_time || 0) / 60) + 'м';
                    document.getElementById('statSessions').innerText = me.sessions_count || 0;
                    document.getElementById('statMsgs').innerText = me.msg_count || 0;
                    document.getElementById('statBadges').innerText = (me.badges || []).length;
                    document.getElementById('myTimer').innerText = formatTime(me.study_time || 0);
                    
                    // Обновляем ачивку "Пьедестал", если вошли в ТОП-3
                    const sorted = [...users].sort((a,b) => (b.study_time||0) - (a.study_time||0));
                    const myRank = sorted.findIndex(u => u.id === currentUser.id);
                    if (myRank >= 0 && myRank < 3 && !(me.badges || []).includes('pedestal')) {
                        let nb = me.badges || [];
                        nb.push('pedestal');
                        await supabase.from('profiles').update({ badges: nb }).eq('id', currentUser.id);
                    }
                }
            }

            // Рендер вкладки Рейтинга
            const leaderboardContainer = document.getElementById('leaderboardList');
            const sortedUsers = [...users].sort((a, b) => (b.study_time || 0) - (a.study_time || 0));
            leaderboardContainer.innerHTML = sortedUsers.map((u, idx) => `
                <div class="monitor-item">
                    <div class="item-left">
                        <div style="font-weight:bold; color: var(--accent-purple); width:20px;">#${idx+1}</div>
                        <div class="item-name">${u.username}</div>
                    </div>
                    <div class="item-time">${formatTime(u.study_time || 0)}</div>
                </div>
            `).join('');

            // Рендер вкладки достижений
            const myBadges = currentUser ? (users.find(u => u.id === currentUser.id)?.badges || []) : [];
            const achContainer = document.getElementById('achievementsList');
            achContainer.innerHTML = Object.keys(ALL_ACHIEVEMENTS).map(key => {
                const ach = ALL_ACHIEVEMENTS[key];
                const isLocked = !myBadges.includes(key);
                return `
                    <div class="ach-card ${isLocked ? 'locked' : ''}">
                        <div class="ach-icon">${ach.icon}</div>
                        <div class="ach-info">
                            <h4>${ach.title}</h4>
                            <p>${ach.desc}</p>
                            <span class="ach-rarity rarity-${ach.rarity}">${ach.rarity}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Загрузка сообщений чата
        const { data: msgs } = await supabase.from('chat_messages').select('*').order('created_at', { ascending: true }).limit(40);
        if (msgs) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = msgs.map(m => `
                <div class="msg-row"><span class="msg-author">${m.username}:</span> <span style="color:#fff;">${m.message}</span></div>
            `).join('');
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    async function sendMsg() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !currentUser) return;

        const name = currentUser.user_metadata.full_name || currentUser.email.split('@')[0];
        
        await supabase.from('chat_messages').insert({
            user_id: currentUser.id,
            username: name,
            message: text
        });

        // Обновление счетчика сообщений и ачивок чата
        const { data: me } = await supabase.from('profiles').select('msg_count, badges').eq('id', currentUser.id).single();
        let count = (me?.msg_count || 0) + 1;
        let nb = me?.badges || [];

        if (count >= 1 && !nb.includes('first_talk')) nb.push('first_talk');
        if (count >= 20 && !nb.includes('activist')) nb.push('activist');
        if (count >= 50 && !nb.includes('soul')) nb.push('soul');

        await supabase.from('profiles').update({ msg_count: count, badges: nb }).eq('id', currentUser.id);

        input.value = '';
        loadData();
    }

    function switchTab(tabName) {
        activeTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        
        if (tabName === 'group') {
            document.getElementById('tabBtnGroup').classList.add('active');
            document.getElementById('tab-group').style.display = 'block';
        } else if (tabName === 'leader') {
            document.getElementById('tabBtnLeader').classList.add('active');
            document.getElementById('tab-leader').style.display = 'block';
        } else if (tabName === 'ach') {
            document.getElementById('tabBtnAch').classList.add('active');
            document.getElementById('tab-ach').style.display = 'block';
        }
    }

    // ТАЙМЕР ОБНОВЛЕНИЯ ВРЕМЕНИ (Раз в 5 секунд накручиваем время, если статус "Учусь")
    setInterval(async () => {
        if (currentUser) {
            // Продлеваем отметку "В сети"
            await supabase.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', currentUser.id);

            if (isStudying) {
                const { data: me } = await supabase.from('profiles').select('study_time, badges').eq('id', currentUser.id).single();
                let newTime = (me?.study_time || 0) + 5;
                let nb = me?.badges || [];

                // Проверка накопительных временных ачивок
                if (newTime >= 18000 && !nb.includes('workaholic')) nb.push('workaholic'); // 5 часов
                if (newTime >= 36000 && !nb.includes('dedication')) nb.push('dedication');   // 10 часов
                if (newTime >= 72000 && !nb.includes('legend')) nb.push('legend');           // 20 часов

                await supabase.from('profiles').update({ study_time: newTime, badges: nb }).eq('id', currentUser.id);
            }
        }
        loadData();
    }, 5000);

    // Первичный запуск
    checkAuth();
    setInterval(loadData, 4000);
</script>

</body>
</html>
